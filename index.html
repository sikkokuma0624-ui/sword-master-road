<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剣の達人への道 無限修練版</title>
<style>
:root{
  --bg:#0b0b10;
  --bg2:#12121a;
  --panel:#171722;
  --panel2:#1d1d2b;
  --line:#34344a;
  --text:#e9e9f2;
  --muted:#a8a8bd;
  --accent:#ffd54f;
  --accent2:#82b1ff;
  --good:#7ec850;
  --bad:#ef5350;
  --rare:#64b5f6;
  --epic:#ba68c8;
  --legend:#ffb300;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(1200px 500px at 20% -10%, #1c1c30 0%, transparent 60%),
    radial-gradient(900px 400px at 90% 0%, #231a2b 0%, transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:"Yu Gothic","Meiryo",sans-serif;
  line-height:1.7;
}
#app{max-width:1150px;margin:0 auto;padding:14px}
h1,h2,h3{margin:8px 0}
.title{
  color:var(--accent);
  font-size:34px;
  text-shadow:0 0 18px rgba(255,213,79,.18);
}
.subtitle{color:var(--muted); font-size:14px}
.panel{
  background:linear-gradient(180deg, rgba(255,255,255,.02), transparent), var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.22);
}
.panel.dark{background:var(--bg2)}
.center{text-align:center}
.small{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.good{color:var(--good)}
.bad{color:var(--bad)}
.gold{color:var(--accent)}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:10px;
}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
}
.card.learned{border-color:#578f57}
.card.selected{outline:2px solid var(--accent2)}
button{
  background:#242438;
  color:var(--text);
  border:1px solid #4a4a6d;
  border-radius:10px;
  padding:10px 12px;
  cursor:pointer;
  font-size:14px;
}
button:hover{background:#2d2d47}
button:disabled{opacity:.38;cursor:not-allowed}
button.primary{background:#31415f;border-color:#5b7bb6}
button.danger{background:#4d1d1d;border-color:#8a3030}
button.ghost{background:transparent}
input,select{
  width:100%;
  padding:11px;
  margin:6px 0 12px;
  background:#101018;
  color:var(--text);
  border:1px solid #4a4a6d;
  border-radius:10px;
}
.header{
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:16px;
  background:linear-gradient(90deg, rgba(255,213,79,.06), transparent), var(--panel);
  margin-bottom:12px;
}
.nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.nav button{
  border-radius:999px;
  padding:9px 14px;
}
.nav button.active{
  background:#374b73;
  border-color:#7291cf;
}
.pill{
  display:inline-block;
  padding:3px 9px;
  border-radius:999px;
  background:#20202f;
  border:1px solid #464665;
  font-size:12px;
  color:#dedeff;
  margin:2px 3px 2px 0;
}
.pill.warn{border-color:#a67c00;color:#ffd54f}
.pill.good{border-color:#4d8a4d;color:#b9f6ca}
.pill.bad{border-color:#a04040;color:#ffcdd2}
.bar{
  width:100%;
  height:15px;
  background:#15151d;
  border:1px solid #3c3c52;
  border-radius:8px;
  overflow:hidden;
  margin:5px 0;
}
.bar div{height:100%;width:0%}
.bar.hp div{background:linear-gradient(90deg,#ff5252,#ff8a80)}
.bar.ki div{background:linear-gradient(90deg,#2196f3,#90caf9)}
.bar.exp div{background:linear-gradient(90deg,#ffd54f,#fff176)}
.bar.enemy div{background:linear-gradient(90deg,#b71c1c,#ef5350)}
.log{
  height:360px;
  overflow-y:auto;
  background:#0a0a0e;
  border:1px solid #303043;
  border-radius:12px;
  padding:10px;
  font-size:13px;
  margin:10px 0;
}
.log div{
  padding:6px 4px;
  border-bottom:1px dashed #20202d;
}
.log-system{color:#b9b9ce}
.log-stance{color:#90caf9;font-style:italic}
.log-tech{color:#e1bee7}
.log-skill{color:#ffd54f;font-weight:700;text-shadow:0 0 10px rgba(255,213,79,.22)}
.log-impact{color:#ffab91;font-weight:700}
.log-crit{color:#fff176;font-weight:800}
.log-enemy{color:#ef9a9a}
.log-enemySkill{color:#ff7043;font-weight:700;text-shadow:0 0 10px rgba(255,82,82,.2)}
.log-defense{color:#9fa8da}
.log-stat{color:#80cbc4}
.log-result{color:#b9f6ca;font-weight:800}
.skillFlavor{margin-top:7px;padding:8px 10px;border-left:3px solid #8f78d8;background:#141420;color:#d8d1f4;font-size:13px}
.battleRow{
  display:grid;
  grid-template-columns:1fr 80px 1fr;
  gap:10px;
  align-items:start;
}
.vs{
  align-self:center;
  text-align:center;
  font-weight:bold;
  color:var(--accent);
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}
.skillButtons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  width:100%;
  margin-top:10px;
}
.skillButtons button{
  min-width:175px;
  text-align:left;
}
.treeWrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:14px;
  background:
    radial-gradient(400px 180px at 30% 0%, rgba(130,177,255,.06), transparent),
    #0d0d13;
  padding:10px;
}
.tree{
  position:relative;
  width:620px;
  height:540px;
}
.tree svg{
  position:absolute;
  left:0;
  top:0;
  z-index:0;
}
.node{
  position:absolute;
  width:170px;
  height:58px;
  z-index:1;
  border-radius:12px;
  border:1px solid #50506e;
  background:#181824;
  padding:6px 8px;
  cursor:pointer;
  font-size:11px;
  overflow:hidden;
}
.node b{font-size:12px}
.node.locked{opacity:.45}
.node.available{border-color:#68a0ff;background:#172136}
.node.learned{border-color:#67b167;background:#16231a}
.node.selected{outline:2px solid var(--accent)}
.svgline{stroke:#4a4a63;stroke-width:2}
.svgline.learned{stroke:#67b167}
.itemName{font-weight:bold}
.rarity-common{color:#cfcfcf}
.rarity-fine{color:#7ec850}
.rarity-rare{color:#64b5f6}
.rarity-epic{color:#ba68c8}
.rarity-legendary{color:#ffb300}
.loading{
  padding:30px;
  text-align:center;
  color:var(--muted);
}
.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;background:#111119}
td,th{
  border-bottom:1px solid #2d2d3e;
  padding:9px 8px;
  font-size:14px;
  white-space:nowrap;
}
th{color:#c9c9dd;background:#181822}
.storyText{
  min-height:120px;
  font-size:17px;
  padding:10px 4px;
}
.footerNote{
  color:#87879c;
  font-size:12px;
  margin-top:10px;
}
@media (max-width:800px){
  .battleRow{grid-template-columns:1fr}
  .vs{display:none}
}
</style>
</head>

function esc(v){
  return String(v).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}
function fmt(n){
  if(!isFinite(n)) return '∞';
  return Math.floor(n).toLocaleString('ja-JP');
}
function chance(p){ return Math.random() * 100 < p; }
function rand(n){ return Math.floor(Math.random() * (n + 1)); }
function choice(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function weightedSwordStat(){
  const pool = [];
  for(const key of STAT_KEYS){
    const weight = Math.max(1, Math.floor((S.stats[key] || 1) / 5));
    for(let i=0;i<weight;i++) pool.push(key);
  }
  return choice(pool);
}

function expNeeded(lv){

}

}

function inferredSkillTags(sk){
  if(!sk) return [];
  if(Array.isArray(sk.tags)) return sk.tags;
  const n=sk.name, tags=[];
  if(/居合|抜刀|鞘|無明/.test(n)) tags.push('抜刀','会心');
  if(/双剣|剣舞|二天|連|千鳥|双天|乱舞/.test(n)) tags.push('多段','疾風');
  if(/大剣|叩き|地割|山岳|破城|断岳|粉城/.test(n)) tags.push('重撃','破城');
  if(/炎|氷|雷|魔|紅蓮|白亜|紫電/.test(n)) tags.push('属性','魔力');
  if(/盾|聖|祈り|守護|城壁|聖域/.test(n)) tags.push('守護','回復');
  if(/血|呪|犠牲|黒蝕|冥/.test(n)) tags.push('自傷','吸血');
  if(/心眼|無念|無刀|受け流し|残心|流転/.test(n)) tags.push('見切り','心眼');
  if(!tags.length) tags.push('基本');
  return [...new Set(tags)];
}
function skillMastery(id){
  const m=S.skillMastery[id] || {uses:0,level:1};
  let level=1;
  for(let i=1;i<MASTERY_THRESHOLDS.length;i++) if(m.uses>=MASTERY_THRESHOLDS[i]) level=i+1;
  return {uses:m.uses||0,level:Math.min(5,level)};
}
function masteryNextText(id){

}
function recordSkillUse(id){

  S.skillMastery[id]=raw;

  if(after>before) blog(`${SKILLS[id].name}の熟練度が${after}へ上昇！ 威力と気力効率が高まった。`,'result');
}
function skillKiCost(sk){
  const base=sk.ki||0, lv=skillMastery(sk.id).level;
  return Math.max(0,base-Math.max(0,lv-2));
}
function activeSynergies(){
  const ids=[...usableSkillIds('active'),...usableSkillIds('passive')];
  const counts={};
  for(const id of ids) for(const tag of inferredSkillTags(SKILLS[id])) counts[tag]=(counts[tag]||0)+1;
  return SYNERGIES.filter(s=>(counts[s.tag]||0)>=s.need);
}

function isFinalClass(id){ return Object.prototype.hasOwnProperty.call(FINAL_CLASS_FROM, id); }
function canChangeClass(id){
  const c = CLASSES[id];
  if(!c) return false;
  if(S.classId === id) return false;
  if(S.level < c.reqLevel) return false;
  if(ADVANCED_CLASSES.includes(id) && S.classPath && S.classPath !== id) return false;
  if(id === 'kensei' && (S.classId !== 'kenshi' || S.classPath)) return false;
  if(isFinalClass(id) && id !== 'kensei' && (S.classId !== FINAL_CLASS_FROM[id] || S.classPath !== FINAL_CLASS_FROM[id])) return false;
  return true;
}
function usableSkillIds(type){
  if(type==='passive') return S.ui.passiveLoadout.filter(id=>hasSkill(id)&&SKILLS[id]&&SKILLS[id].type==='passive');
  const ids=S.ui.activeLoadout.filter(id=>hasSkill(id)&&SKILLS[id]&&SKILLS[id].type==='active'&&!isUltimateSkill(SKILLS[id]));
  if(S.ui.ultimateLoadout && hasSkill(S.ui.ultimateLoadout)) ids.push(S.ui.ultimateLoadout);
  return ids;
}
function canLearnSkill(sk){
  if(!sk) return false;
  if(S.classId !== sk.cls) return false;
  if(hasSkill(sk.id)) return false;
  if(S.sp < sk.sp) return false;
  return sk.req.every(hasSkill);
}

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    const def = defaultState();
    S = Object.assign({}, def, d);
    S.stats = Object.assign({}, def.stats, d.stats || {});
    S.equip = Object.assign({}, def.equip, d.equip || {});
    S.ui = Object.assign({}, def.ui, d.ui || {});
    S.social = Object.assign({}, def.social, d.social || {});
    S.online = Object.assign({}, def.online, d.online || {});
    if(!Array.isArray(S.clearedAreas)) S.clearedAreas=[];
    S.areaWins=Object.assign({},d.areaWins||{});
    S.skillMastery=Object.assign({},d.skillMastery||{});
    if(!Array.isArray(S.social.disciples)) S.social.disciples=[];
    if(!Array.isArray(S.ui.inheritActive)) S.ui.inheritActive = [];
    if(!Array.isArray(S.ui.inheritPassive)) S.ui.inheritPassive = [];
    S.ui.inheritActive = S.ui.inheritActive.filter(id => SKILLS[id] && SKILLS[id].type === 'active').slice(0,2);
    S.ui.inheritPassive = S.ui.inheritPassive.filter(id => SKILLS[id] && SKILLS[id].type === 'passive').slice(0,2);
    if(!Array.isArray(S.learned)) S.learned = [];
    if(!Array.isArray(S.inventory)) S.inventory = [];
    for(const item of [...S.inventory,...Object.values(S.equip).filter(Boolean)]) if(item.enhance==null) item.enhance=0;
    if(!Array.isArray(S.ui.activeLoadout)) S.ui.activeLoadout=[];
    if(!Array.isArray(S.ui.passiveLoadout)) S.ui.passiveLoadout=[];
    S.ui.activeLoadout=S.ui.activeLoadout.filter(id=>SKILLS[id]&&hasSkill(id)&&!isUltimateSkill(SKILLS[id])).slice(0,4);
    S.ui.passiveLoadout=S.ui.passiveLoadout.filter(id=>SKILLS[id]&&hasSkill(id)&&SKILLS[id].type==='passive').slice(0,4);
    if(!S.ui.ultimateLoadout || !SKILLS[S.ui.ultimateLoadout] || !hasSkill(S.ui.ultimateLoadout)) S.ui.ultimateLoadout=null;
    if(!S.ui.activeLoadout.length) S.ui.activeLoadout=S.learned.filter(id=>SKILLS[id]&&SKILLS[id].type==='active'&&!isUltimateSkill(SKILLS[id])&&SKILLS[id].cls===S.classId).slice(0,4);
    if(!S.ui.passiveLoadout.length) S.ui.passiveLoadout=S.learned.filter(id=>SKILLS[id]&&SKILLS[id].type==='passive'&&SKILLS[id].cls===S.classId).slice(0,4);
    if(!S.ui.ultimateLoadout) S.ui.ultimateLoadout=S.learned.find(id=>SKILLS[id]&&isUltimateSkill(SKILLS[id])&&SKILLS[id].cls===S.classId)||null;
    if(!S.classPath){
      if(ADVANCED_CLASSES.includes(S.classId)) S.classPath = S.classId;
      const parent = FINAL_CLASS_FROM[S.classId];
      if(parent && parent !== 'kenshi') S.classPath = parent;
    }
    S.battle = null;
    S.rankingLoading = false;
    S.rankingData = null;
    if(S.screen === 'battle') S.screen = 'adventure';
    return true;
  }catch(e){
    return false;
  }
}

    const titles = ['居合好き','大剣馬鹿','二刀の舞','魔剣憑き','聖盾守護者','呪血の刃','剣聖志望','道場破り','謎の老人','剣に愛されし者'];
    const arr = [];
    for(let i=0;i<12;i++){
      arr.push({
        id:'npc' + (i+1),
        name:names[i % names.length],
        title:titles[Math.floor(Math.random()*titles.length)],
        classId:CLASS_ORDER[(i%7)+1],
        rating:Math.max(0, Math.floor(1000 + (i-5)*65 + Math.random()*80 - 40)),
        level:Math.max(1, Math.floor((playerLevel || 1) * (0.8 + i*0.05))),
        power:Math.max(100,Math.floor((playerLevel||1)*500*(.7+i*.07))),seasonId:SEASON_ID
      });
    }
    return arr;
  },
  async fetchRanking(player){
    await this.delay();
    let db = this.read();
    if(!db || !db.npcs){
      db = {npcs:this.makeNPCs(player.level), updatedAt:Date.now()};
      this.write(db);
    }
    db.npcs.forEach((n,i) => {
      n.level = Math.max(1, Math.floor(player.level * (0.85 + (i % 5)*0.08)));
      n.power=Math.max(100,Math.floor(player.power*(.72+i*.055)));
      n.seasonId=SEASON_ID;
      n.defenseSnapshot={schemaVersion:1,userId:n.id,seasonId:SEASON_ID,classId:n.classId||'kenshi',level:n.level,power:n.power,rating:n.rating,aiMode:'defense'};
    });
    const entries = [
      ...db.npcs,
      {
        id:'player',
        name:player.name,
        title:CLASSES[player.classId].name,
        level:player.level,
        rating:player.rating,
        power:player.power,
        seasonId:SEASON_ID,
        isPlayer:true
      }
    ];
    return {
      pvp:[...entries].sort((a,b)=>b.rating-a.rating).slice(0,20),
      power:[...entries].sort((a,b)=>b.power-a.power).slice(0,20),updatedAt:db.updatedAt,seasonId:SEASON_ID
    };
  },
  async submitBattle(report){
    await this.delay();
    let db = this.read();
    if(!db || !db.npcs){
      db = {npcs:this.makeNPCs(report.player.level), updatedAt:Date.now()};
    }
    if(report.opponentId && report.opponentId.startsWith('npc')){
      const npc = db.npcs.find(n => n.id === report.opponentId);
      if(npc) npc.rating = Math.max(0, npc.rating + (report.win ? -18 : 18));
    }
    db.updatedAt = Date.now();
    this.write(db);
    return {ok:true};
  }
};

function getPassiveBonuses(){
  const p = {
    atkPct:0, defPct:0, hpPct:0, spdPct:0, crit:0, dodge:0,
    skillPct:0, kiMax:0, lifesteal:0, counter:0, pvp:0,
    regen:0, expBonus:0, goldBonus:0
  };
  for(const id of usableSkillIds('passive')){
    const sk = SKILLS[id];
    if(!sk || !sk.passive) continue;
    for(const key of Object.keys(sk.passive)){
      if(p.hasOwnProperty(key)) p[key] += sk.passive[key];
    }
  }
  for(const syn of activeSynergies()){
    for(const [key,value] of Object.entries(syn.bonus)) if(p.hasOwnProperty(key)) p[key]+=value;
  }
  return p;
}
function itemValue(item,key){
  const base=item && item[key] ? item[key] : 0;
  return Math.floor(base*(1+(item.enhance||0)*.12));
}
function getEquipBonuses(){
  const b = {
    atk:0, def:0, hp:0, spd:0, crit:0, dodge:0, ki:0,
    lifesteal:0, skillPct:0, pvp:0, expBonus:0, goldBonus:0, counter:0
  };
  for(const slot of ['weapon','armor','accessory']){
    const item = S.equip[slot];
    if(!item) continue;
    for(const key of Object.keys(b)){
      if(item[key]) b[key] += itemValue(item,key);
    }
  }
  return b;
}
function getDerived(){
  const cls = CLASSES[S.classId] || CLASSES.kenshi;
  const p = getPassiveBonuses();
  const eq = getEquipBonuses();

  const bond=1+bondBonusPct()/100;
  const maxHP = Math.floor((Math.floor((60 + S.level*12 + S.stats.vit*14) * cls.hp * (1 + p.hpPct/100)) + eq.hp)*bond);
  const maxKI = Math.floor(30 + S.stats.ki*4 + S.level*2 + p.kiMax + eq.ki);
  const attack = Math.floor((S.stats.str*2 + S.stats.tec*0.7 + eq.atk) * cls.atk * (1 + p.atkPct/100)*bond);
  const defense = Math.floor((S.stats.def*1.6 + S.stats.vit*0.6 + eq.def) * cls.def * (1 + p.defPct/100)*bond);
  const speed = Math.floor((S.stats.agi*2 + S.stats.foc*0.4 + eq.spd + S.level*0.2) * cls.spd * (1 + p.spdPct/100)*bond);
  const crit = Math.floor(5 + S.stats.luk*0.25 + S.stats.tec*0.1 + eq.crit + p.crit);
  const dodge = Math.min(55, Math.floor(S.stats.agi*0.18 + S.stats.luk*0.08 + eq.dodge + p.dodge));
  const skillPower = (1 + S.stats.foc*0.008 + (p.skillPct + eq.skillPct)/100) * cls.skill;

  return {
    maxHP, maxKI, attack, defense, speed, crit, dodge, skillPower,
    lifesteal:p.lifesteal + eq.lifesteal,
    counter:p.counter + eq.counter,
    pvpBonus:p.pvp + eq.pvp + S.stats.pre*0.15,
    expBonus:p.expBonus + eq.expBonus,
    goldBonus:p.goldBonus + eq.goldBonus
  };
}
function getCombatPower(){
  const d=getDerived();
  const mastery=Object.keys(S.skillMastery).reduce((a,id)=>a+skillMastery(id).level,0);
  return Math.floor(d.maxHP*.35+d.attack*9+d.defense*7+d.speed*5+d.crit*30+d.dodge*25+d.maxKI*2+mastery*12+S.level*80);
}
function buildDefenseSnapshot(){
  return {
    schemaVersion:1,userId:S.online.userId,seasonId:SEASON_ID,name:S.name,classId:S.classId,
    level:S.level,rating:S.rating,power:getCombatPower(),stats:{...S.stats},
    loadout:{active:[...S.ui.activeLoadout],passive:[...S.ui.passiveLoadout],ultimate:S.ui.ultimateLoadout},
    equip:['weapon','armor','accessory'].map(slot=>S.equip[slot]?{slot,name:S.equip[slot].name,rarity:S.equip[slot].rarity,level:S.equip[slot].level,enhance:S.equip[slot].enhance||0}:null),
    swordRank:swordRankName(),bondBonus:bondBonusPct(),updatedAt:Date.now()
  };
}

const RARITIES = {
  common:{name:'通常', mult:1, color:'#cfcfcf', cls:'rarity-common'},
  fine:{name:'良質', mult:1.3, color:'#7ec850', cls:'rarity-fine'},
  rare:{name:'名工', mult:1.7, color:'#64b5f6', cls:'rarity-rare'},
  epic:{name:'秘宝', mult:2.3, color:'#ba68c8', cls:'rarity-epic'},
  legendary:{name:'伝説', mult:3.2, color:'#ffb300', cls:'rarity-legendary'}
};
function rollRarity(luk, boss){
  const r = Math.random()*100 - (luk*0.15) - (boss ? 20 : 0);
  if(r < 2) return 'legendary';
  if(r < 8) return 'epic';
  if(r < 20) return 'rare';
  if(r < 45) return 'fine';
  return 'common';
}
function makeItemName(slot, rarity){
  const base = {
    weapon:['木剣','鉄剣','鋼剣','秘銀剣','霊剣','魔剣','聖剣','神剣'],
    armor:['布鎧','革鎧','鉄鎧','鋼鎧','騎士鎧','霊鎧','聖鎧','神鎧'],
    accessory:['お守り','指輪','護符','首飾り','徽章','羽飾り','勾玉','刻印']
  }[slot];
  const prefix = {
    common:'', fine:'良質な ', rare:'名工の ', epic:'秘宝 ', legendary:'伝説の '
  }[rarity];
  return prefix + choice(base);
}
function generateItem(level, rarity=null, boss=false){
  if(!rarity) rarity = rollRarity(S.stats.luk, boss);
  const slot = choice(['weapon','armor','accessory']);
  const mult = RARITIES[rarity].mult;
  const budget = Math.max(1, Math.floor(level * mult));
  const item = {
    id:uid(), slot, rarity, level,
    enhance:0,
    name:makeItemName(slot, rarity),
    atk:0, def:0, hp:0, spd:0, crit:0, dodge:0, ki:0,
    lifesteal:0, skillPct:0, pvp:0,
    sell:Math.floor(20 * level * mult)
  };

  if(slot === 'weapon'){
    item.atk = Math.floor(budget*2.2 + rand(budget));
    item.crit = Math.floor(budget/8);
    if(rarity !== 'common' && chance(30)) item.lifesteal = 1 + Math.floor(mult);
  }else if(slot === 'armor'){
    item.def = Math.floor(budget*1.5 + rand(budget));
    item.hp = Math.floor(budget*6);
    if(chance(20)) item.ki = Math.floor(budget/4);
  }else{
    item.spd = Math.floor(budget/3);
    item.crit = Math.floor(budget/10);
    item.dodge = Math.floor(budget/12);
    if(chance(20)) item.skillPct = Math.floor(2 + mult);
    if(rarity === 'legendary' && chance(40)) item.pvp = 5;
  }
  return item;
}
function itemStatsText(item){
  const arr = [];
  if(item.atk) arr.push(`攻撃+${fmt(itemValue(item,'atk'))}`);
  if(item.def) arr.push(`防御+${fmt(itemValue(item,'def'))}`);
  if(item.hp) arr.push(`HP+${fmt(itemValue(item,'hp'))}`);
  if(item.spd) arr.push(`速さ+${fmt(itemValue(item,'spd'))}`);
  if(item.crit) arr.push(`会心+${fmt(itemValue(item,'crit'))}%`);
  if(item.dodge) arr.push(`回避+${fmt(itemValue(item,'dodge'))}%`);
  if(item.ki) arr.push(`気力+${fmt(itemValue(item,'ki'))}`);
  if(item.lifesteal) arr.push(`吸血+${fmt(itemValue(item,'lifesteal'))}%`);
  if(item.skillPct) arr.push(`スキル+${fmt(itemValue(item,'skillPct'))}%`);
  if(item.pvp) arr.push(`PVP+${fmt(itemValue(item,'pvp'))}%`);
  return arr.join(' / ') || '効果なし';
}
function enhanceCost(item){ return Math.floor(120*Math.pow((item.enhance||0)+1,2)*Math.max(1,item.level/5)); }

function makeEnemy(areaId){
  const area = AREAS.find(a => a.id === areaId) || AREAS[0];
  const lvl = Math.max(1, Math.floor(S.level * area.mult * (0.85 + Math.random()*0.3)));
  let name = choice(area.enemies);
  let boss = false;

  if(Math.random() < 0.06){
    name = '【主】' + name;
    boss = true;
  }

  const maxHP = Math.floor((45 + lvl*18) * area.mult * (boss ? 2.2 : 1));
  const atk = Math.floor((8 + lvl*4.2) * area.mult * (boss ? 1.4 : 1));
  const def = Math.floor((4 + lvl*2.6) * area.mult * (boss ? 1.2 : 1));
  const speed = Math.floor(8 + lvl*2.1 * (boss ? 1.1 : 1));
  const exp = Math.floor((25 + lvl*42) * area.mult * (boss ? 4 : 1));

  return {
    name, level:lvl, maxHP, hp:maxHP, atk, def, speed, exp, gold,
    isPvp:false, boss, fixedBoss:false, areaId:area.id, dropRate:area.dropRate,

  };
}
function makeAreaBoss(areaId){
  const area=AREAS.find(a=>a.id===areaId)||AREAS[0];
  const spec=AREA_BOSSES[area.id];
  const lvl=Math.max(5,Math.floor(S.level*area.mult));

    name:`【${spec.title}】${spec.name}`,level:lvl,maxHP,hp:maxHP,
    atk:Math.floor((12+lvl*5)*power),def:Math.floor((8+lvl*3.2)*power),speed:Math.floor((10+lvl*2.2)*Math.min(1.4,power)),
    exp:Math.floor((100+lvl*80)*power),gold:spec.rewardGold,isPvp:false,boss:true,fixedBoss:true,
    areaId:area.id,dropRate:1,rating:0,opponentId:null,skills:makeEnemySkills(spec.name,true)
  };
}
function makePvpEnemy(op){
  const lvl = Math.max(1, op.level || Math.floor(S.level * (0.9 + Math.random()*0.25)));
  const powerRatio=(op.power||getCombatPower())/Math.max(1,getCombatPower());
  const factor = Math.max(0.7, Math.min(2.0, (1 + ((op.rating - S.rating) / 2500))*Math.pow(powerRatio,.25)));
  const maxHP = Math.floor((60 + lvl*20) * factor * (1 + Math.min(3, lvl*0.015)));
  const atk = Math.floor((10 + lvl*4.3) * factor);
  const def = Math.floor((6 + lvl*2.7) * factor);
  const speed = Math.floor(9 + lvl*2.2 * factor);
  const exp = Math.floor(20 + lvl*20);
  const gold = Math.floor(20 + lvl*22);

  return {
    name:`${op.name}（${op.title}）`,
    level:lvl, maxHP, hp:maxHP, atk, def, speed, exp, gold,
    isPvp:true, boss:false, rating:op.rating, opponentId:op.id,
    power:op.power||0,defenseAI:true,seasonId:SEASON_ID,skills:makeEnemySkills(op.title || op.name,false)
  };
}

function canAct(){ return S.battle && !S.battle.over; }
function addStack(type, amount){
  const b = S.battle;
  if(!b) return;
  const max = STACK_MAX[type] || 5;
  b.stacks[type] = Math.min(max, (b.stacks[type] || 0) + amount);
}
function setEnemyStatus(type, turns, value){
  const b = S.battle;
  if(!b) return;
  if(type === 'stun'){
    b.enemyStatuses.stun = Math.max(b.enemyStatuses.stun, turns);
  }else if(type === 'freeze'){
    b.enemyStatuses.freeze = Math.max(b.enemyStatuses.freeze, turns);
  }else if(b.enemyStatuses[type]){
    b.enemyStatuses[type].turns = Math.max(b.enemyStatuses[type].turns, turns);
    if(value) b.enemyStatuses[type].value = Math.max(b.enemyStatuses[type].value, value);
  }
}
function calcDamage(atk, def, power, opts={}){
  const ignoreDef = opts.ignoreDef || 0;
  const crit = !!opts.crit;
  const skillPower = opts.skillPower || 1;

  let a = atk * power * skillPower;
  let d = def * (1 - ignoreDef/100);
  let dmg = a - d*0.6;
  dmg *= 0.9 + Math.random()*0.2;
  if(crit) dmg *= 1.7;
  return Math.max(1, Math.floor(dmg));
}
function enemySpeed(b){
  let spd = b.enemy.speed * (1 - Math.max(0, b.enemyDebuffs.spd)/100);
  if(b.enemyStatuses.freeze > 0) spd *= 0.6;
  return spd;
}
function skillUsable(sk){
  const b = S.battle;
  if(!b || !sk || sk.type !== 'active') return false;
  if(skillKiCost(sk) > b.playerKI) return false;
  if(sk.hpCost){
    const cost = Math.floor(b.maxHP * sk.hpCost / 100);
    if(b.playerHP <= cost + 1) return false;
  }
  const cons = sk.fx && sk.fx.stackConsume;
  if(cons && cons.required && (b.stacks[cons.type] || 0) <= 0) return false;
  return true;
}
function dealPlayerHits(d, sk, stackBonus, name){
  const b = S.battle;
  const hits = sk.hits || 1;
  let total = 0;

  for(let i=0;i<hits;i++){
    if(b.enemy.hp <= 0) break;
    if(Math.random() < 0.04){
      blog(`${b.enemy.name}が剣筋を読み、紙一重で身を逸らした！`,'enemy');
      continue;
    }

    let power = ((sk.power || 1) + stackBonus) * (1+(skillMastery(sk.id).level-1)*.03);
    if(sk.lowHpBoost && b.playerHP < b.maxHP*0.3){
      power *= 1.5;
      blog(`体力が尽きかけても剣先は下がらない。精神力${fmt(S.stats.men)}が窮地を力へ変える！`,'stat');
    }

    const critChance = d.crit + (b.buffs.crit || 0) + (sk.critBonus || 0);
    const crit = Math.random()*100 < critChance;

    let atk = d.attack * (1 + b.buffs.atk/100);
    if(b.isPvp) atk *= 1 + d.pvpBonus/100;

    const enemyDef = b.enemy.def * (1 - Math.max(0, b.enemyDebuffs.def)/100);
    const dmg = calcDamage(atk, enemyDef, power, {
      ignoreDef:sk.ignoreDef || 0,
      crit,
      skillPower:d.skillPower
    });

    b.enemy.hp -= dmg;
    total += dmg;
    blog(`${name}${hits > 1 ? `・${i+1}撃目` : ''}――${fmt(dmg)}ダメージ！`+(crit ? '【会心】' : ''),crit ? 'crit' : 'impact');
    blog(impactLine(dmg,b.enemy.maxHP,crit),crit ? 'crit' : 'tech');
  }

  const healPct = (sk.healDamage || 0) + d.lifesteal;
  if(total > 0 && healPct > 0){
    const heal = Math.floor(total * healPct / 100);
    b.playerHP = Math.min(b.maxHP, b.playerHP + heal);
    blog(`刃が奪った生命力が傷口を塞ぐ。HP${fmt(heal)}回復！`,'stat');
  }

  return total;
}
function basicAttack(d){
  const b = S.battle;
  b.playerKI = Math.min(b.maxKI, b.playerKI + 6);
  const res = classResource(S.classId);
  if(res) addStack(res, 1);
  blog(basicSwordNarration(d),'tech');
  if(S.stats.tec >= S.level + 12) blog(`技${fmt(S.stats.tec)}が最短の刃筋を選び、会心点へ切先を導く。`,'stat');
  if(S.stats.str >= S.level + 12) blog(`力${fmt(S.stats.str)}の剣圧が敵の防御姿勢を軋ませる。`,'stat');
  dealPlayerHits(d, {power:1, hits:1}, 0, '通常攻撃');
  return true;
}
function useSkillById(id, d){
  const b = S.battle;
  const sk = SKILLS[id];
  if(!sk || !hasSkill(id) || sk.type !== 'active' || !usableSkillIds('active').includes(id)) return false;
  if(!skillUsable(sk)){
    blog('気力・生命・専用ゲージのいずれかが足りず、技の型を完成できない。','system');
    return false;
  }

  const fx = sk.fx || {};

  const actualKiCost=skillKiCost(sk);
  if(actualKiCost) b.playerKI -= actualKiCost;
  if(sk.hpCost){
    const cost = Math.floor(b.maxHP * sk.hpCost / 100);
    b.playerHP -= cost;
    blog(`刃へ生命を捧げ、HP${fmt(cost)}を消費！`,'skill');
  }

  blog(`◆ ${sk.name} ◆`,'skill');
  for(const line of skillPrelude(sk,d)) blog(line,'skill');

  let stackBonus = 0;
  if(fx.stackConsume){
    const type = fx.stackConsume.type;
    const avail = b.stacks[type] || 0;
    if(avail > 0){
      const consumed = Math.min(avail, fx.stackConsume.max || avail);
      b.stacks[type] -= consumed;
      stackBonus = consumed * (fx.stackConsume.perPower || 0);
      blog(`${RESOURCE_NAMES[type]}${consumed}段階を解放。蓄積した剣勢が威力を+${Math.round(stackBonus*100)}%押し上げる！`,'stat');
    }
  }

  if(fx.gainKi){
    b.playerKI = Math.min(b.maxKI, b.playerKI + fx.gainKi);
    blog(`深い呼吸で気脈を整える。気力${fx.gainKi}回復！`,'stat');
  }
  if(fx.healMax){
    const heal = Math.floor(b.maxHP * fx.healMax / 100);
    b.playerHP = Math.min(b.maxHP, b.playerHP + heal);
    blog(`剣気が全身を巡り、傷を内側から塞ぐ。HP${fmt(heal)}回復！`,'stat');
  }
  if(fx.shieldPower){
    const shield = Math.floor(d.defense * fx.shieldPower + d.attack * 0.25);
    b.shield += shield;
    blog(`刃と守りの気が重なり、耐久${fmt(shield)}の光壁を展開！`,'defense');
  }
  if(fx.selfAtk){
    b.buffs.atk = Math.min(80, b.buffs.atk + fx.selfAtk);
    b.buffs.turns = fx.selfTurns || 3;
    blog(`踏み込みと剣圧が増す。攻撃力+${fx.selfAtk}%！`,'stat');
  }
  if(fx.selfDef){
    b.buffs.def = Math.min(80, b.buffs.def + fx.selfDef);
    b.buffs.turns = fx.selfTurns || 3;
    blog(`重心が沈み、崩れぬ構えが完成。防御力+${fx.selfDef}%！`,'defense');
  }
  if(fx.selfDodge){
    b.buffs.dodge = Math.min(40, b.buffs.dodge + fx.selfDodge);
    b.buffs.turns = fx.selfTurns || 3;
    blog(`足捌きが残像を生む。回避+${fx.selfDodge}%！`,'stat');
  }
  if(fx.selfCrit){
    b.buffs.crit = Math.min(40, b.buffs.crit + fx.selfCrit);
    b.buffs.turns = fx.selfTurns || 3;
    blog(`切先が急所へ吸い寄せられる。会心+${fx.selfCrit}%！`,'stat');
  }
  if(fx.dodgeNext){
    b.statuses.dodgeNext = true;
    blog(`心眼が敵の次手を映し出す。次の攻撃を確実に回避！`,'defense');
  }

  if(b.enemy.hp > 0){
    if(fx.enemyAtkDown){
      b.enemyDebuffs.atk = Math.max(b.enemyDebuffs.atk, fx.enemyAtkDown);
      b.enemyDebuffs.turns = 3;
      blog(`剣圧で敵の構えを押し潰す。敵攻撃-${fx.enemyAtkDown}%！`,'stat');
    }
    if(fx.enemyDefDown){
      b.enemyDebuffs.def = Math.max(b.enemyDebuffs.def, fx.enemyDefDown);
      b.enemyDebuffs.turns = 3;
      blog(`防具と構えの継ぎ目を断つ。敵防御-${fx.enemyDefDown}%！`,'stat');
    }
    if(fx.enemySpdDown){
      b.enemyDebuffs.spd = Math.max(b.enemyDebuffs.spd, fx.enemySpdDown);
      b.enemyDebuffs.turns = 3;
      blog(`足運びを斬って機動を奪う。敵速度-${fx.enemySpdDown}%！`,'stat');
    }
    if(fx.burn) setEnemyStatus('burn', 3, Math.floor(d.attack * 0.35));
    if(fx.bleed) setEnemyStatus('bleed', 3, Math.floor(d.attack * 0.30));
    if(fx.curse) setEnemyStatus('curse', 3, Math.floor(d.attack * 0.40));
    if(fx.freeze) setEnemyStatus('freeze', 2);
    if(fx.stunChance && chance(fx.stunChance)){
      setEnemyStatus('stun', 1);
      blog(`衝撃が敵の体勢を完全に崩した。敵は怯んでいる！`,'impact');
    }
  }

  if(fx.stackGain){
    addStack(fx.stackGain.type, fx.stackGain.amount);
  }

  if(sk.power){
    dealPlayerHits(d, sk, stackBonus, sk.name);
  }

  recordSkillUse(id);

  return true;
}
function enemyTurn(d){
  const b = S.battle;
  if(!b || b.over) return;

  if(b.enemyStatuses.stun > 0){
    blog(`${b.enemy.name}は崩された構えを戻せず、剣を振れない！`,'enemy');
    b.enemyStatuses.stun--;
    b.enemyIntent=rollEnemyIntent(b.enemy);
    return;
  }
  if(b.enemyStatuses.freeze > 0 && chance(25)){
    blog(`凍結した関節が軋み、${b.enemy.name}の攻撃が止まる！`,'enemy');
    b.enemyIntent=rollEnemyIntent(b.enemy);
    return;
  }
  if(b.statuses.dodgeNext){
    b.statuses.dodgeNext = false;
    blog(`心眼が捉えた未来どおり半歩だけ退く。敵の刃は虚空を斬った！`,'defense');
    b.enemyIntent=rollEnemyIntent(b.enemy);
    return;
  }

  const dodgeChance = Math.max(0,Math.min(65, d.dodge + b.buffs.dodge + (b.enemyStatuses.freeze > 0 ? 10 : 0) - (b.statuses.freeze > 0 ? 15 : 0)));
  if(Math.random()*100 < dodgeChance){
    const dodgeLine = S.stats.agi >= S.stats.def
      ? `素早さ${fmt(S.stats.agi)}の足捌き。刃が届く寸前に間合いの外へ消える！`
      : `技${fmt(S.stats.tec)}で剣先の起こりを読み、最小の動きでかわした！`;
    blog(dodgeLine,'stat');
    b.enemyIntent=rollEnemyIntent(b.enemy);
    return;
  }

  const intent=b.enemyIntent||rollEnemyIntent(b.enemy);
  const useEnemySkill=intent.isSkill;
  const move=intent.move;
  if(useEnemySkill){
    blog(`◆ ${move.name} ◆`,'enemySkill');
    blog(move.text,'enemySkill');
  }else{
    blog(`${b.enemy.name}の${move.name}！`,'enemy');
    blog(move.text,'enemy');
  }

  const enemyAtk = b.enemy.atk * (1 - Math.max(0, b.enemyDebuffs.atk)/100);
  let playerDef = d.defense * (1 + b.buffs.def/100);
  if(b.playerDefending){
    playerDef *= 1.6;
    blog(`守備${fmt(S.stats.def)}の構え。刃を斜めに合わせ、衝撃を地面へ逃がす！`,'defense');
  }

  const hits = move.hits || 1;
  let totalDamage = 0;
  for(let i=0;i<hits;i++){
    const crit = chance(5 + (move.crit || 0));
    let raw = calcDamage(enemyAtk, playerDef, move.power || 1, {crit});
    const menReduce = Math.min(25, S.stats.men * 0.12);
    let dmg = Math.max(1, Math.floor(raw * (1 - menReduce/100)));

    if(chance(Math.min(12,S.stats.luk*.08))){
      const before = dmg;
      dmg = Math.max(1,Math.floor(dmg*.5));
      blog(`幸運${fmt(S.stats.luk)}――刃が鍔へ偶然滑り、威力を${fmt(before-dmg)}軽減！`,'stat');
    }
    if(menReduce >= 5) blog(`精神力${fmt(S.stats.men)}が痛みと恐怖を抑え、衝撃を${Math.floor(menReduce)}%軽減。`,'stat');

    let absorbed = 0;
    if(b.shield > 0){
      absorbed = Math.min(b.shield, dmg);
      b.shield -= absorbed;
      dmg -= absorbed;
    }
    if(absorbed > 0) blog(`光壁と剣が激突。シールドが${fmt(absorbed)}を吸収！`,'defense');
    if(dmg > 0){
      b.playerHP -= dmg;
      totalDamage += dmg;
      blog(`${hits > 1 ? `${i+1}撃目、` : ''}${fmt(dmg)}ダメージ！${crit ? '【敵会心】' : ''}`,crit ? 'enemySkill' : 'enemy');
    }else{
      blog(`刃と刃が噛み合う。守り切り、ダメージを通さない！`,'defense');
    }
  }

  if(move.defDown){ b.buffs.def=Math.max(-45,b.buffs.def-move.defDown); b.buffs.turns=3; blog(`構えを崩され、防御-${move.defDown}%！`,'enemySkill'); }
  if(move.atkDown){ b.buffs.atk=Math.max(-45,b.buffs.atk-move.atkDown); b.buffs.turns=3; blog(`剣気を乱され、攻撃-${move.atkDown}%！`,'enemySkill'); }
  if(move.spdDown){ b.buffs.dodge=Math.max(-35,b.buffs.dodge-move.spdDown); b.buffs.turns=3; blog(`足運びを封じられ、回避-${move.spdDown}%！`,'enemySkill'); }
  if(move.burn && totalDamage>0){ b.statuses.burn={turns:3,value:Math.max(1,Math.floor(enemyAtk*.18))}; blog('鬼火が傷口へ燃え移った。3ターン炎上！','enemySkill'); }
  if(move.curse && totalDamage>0){ b.statuses.curse={turns:3,value:Math.max(1,Math.floor(enemyAtk*.14))}; blog('怨念が気脈へ侵入した。3ターン呪い！','enemySkill'); }
  if(move.freeze && totalDamage>0){ b.statuses.freeze=2; blog('冷気が足を凍らせる。2ターン回避と速度が低下！','enemySkill'); }

  if(d.counter > 0){
    const ref = Math.floor(enemyAtk * d.counter / 100);
    if(ref > 0){
      b.enemy.hp -= ref;
      blog(`敵の刃を受けた瞬間、反射の剣が走る！ ${fmt(ref)}反撃ダメージ！`,'tech');
    }
  }
  b.enemyIntent=rollEnemyIntent(b.enemy);
}
function endRound(d){
  const b = S.battle;
  if(!b || b.over) return;

  for(const type of ['burn','bleed','poison','curse']){
    const st = b.enemyStatuses[type];
    if(st.turns > 0 && b.enemy.hp > 0){
      b.enemy.hp -= st.value;
      blog(`${type === 'burn' ? '炎が斬痕を焼く' : type === 'bleed' ? '斬り開いた傷から血が流れる' : type === 'curse' ? '呪いが敵の内側を蝕む' : '毒が巡る'}。${fmt(st.value)}ダメージ！`,'impact');
      st.turns--;
      if(b.enemy.hp <= 0){
        victory();
        return;
      }
    }
  }

  if(b.enemyStatuses.freeze > 0) b.enemyStatuses.freeze--;

  for(const type of ['burn','curse']){
    const st = b.statuses[type];
    if(st && st.turns > 0){
      b.playerHP -= st.value;
      blog(`${type === 'burn' ? '鬼火が傷を焼く' : '呪いが気脈を蝕む'}。${fmt(st.value)}継続ダメージ！`,'enemySkill');
      st.turns--;
      if(checkPlayerDead()) return;
    }
  }
  if(b.statuses.freeze > 0) b.statuses.freeze--;

  if(b.statuses.regenTurns > 0){
    b.playerHP = Math.min(b.maxHP, b.playerHP + b.statuses.regen);
    blog(`整えた呼吸が生命力を巡らせ、HP${fmt(b.statuses.regen)}回復。`,'stat');
    b.statuses.regenTurns--;
  }

  if(b.buffs.turns > 0){
    b.buffs.turns--;
    if(b.buffs.turns === 0){
      b.buffs = {atk:0, def:0, dodge:0, crit:0, turns:0};
    }
  }

  if(b.enemyDebuffs.turns > 0){
    b.enemyDebuffs.turns--;
    if(b.enemyDebuffs.turns === 0){
      b.enemyDebuffs = {atk:0, def:0, spd:0, turns:0};
    }
  }

  b.turn++;
  blog(`―― 第${fmt(b.turn)}合 ――`,'system');
}
function checkPlayerDead(){
  const b = S.battle;
  if(b.playerHP <= 0){
    b.playerHP = 0;
    defeat();
    return true;
  }
  return false;
}
function performAction(action){
  if(!canAct()) return;

  const d = getDerived();
  const b = S.battle;
  b.playerDefending = false;

  if(action.type === 'defend'){
    b.playerDefending = true;
    b.playerKI = Math.min(b.maxKI, b.playerKI + 20);
    const res = classResource(S.classId);
    if(res === 'guard') addStack('guard', 1);
    blog(`刃を正中線へ立て、守備${fmt(S.stats.def)}の型で敵の剣路を塞ぐ。`,'defense');
    blog(`呼吸を乱さず攻撃を待つ。気力+20。`,'stat');
    enemyTurn(d);
    if(checkPlayerDead()) return;
    if(b.enemy.hp <= 0){ victory(); return; }
    endRound(d);
    if(b.over) return;
    render();
    save();
    return;
  }

  const effectivePlayerSpeed = d.speed * (b.statuses.freeze > 0 ? .6 : 1);
  const playerFirst = effectivePlayerSpeed >= enemySpeed(b);
  if(!playerFirst){
    if(b.statuses.freeze > 0) blog(`凍った足が踏み込みを遅らせる。${b.enemy.name}が先手を取った！`,'enemy');
    else blog(`敵の初動がわずかに上回る。${b.enemy.name}が先手！`,'enemy');
    enemyTurn(d);
    if(checkPlayerDead()) return;
    if(b.enemy.hp <= 0){ victory(); return; }
  }

  let acted = false;
  if(action.type === 'attack'){
    acted = basicAttack(d);
  }else if(action.type === 'skill'){
    acted = useSkillById(action.id, d);
  }

  if(!acted){
    render();
    return;
  }

  if(b.enemy.hp <= 0){
    victory();
    return;
  }

  if(playerFirst){
    enemyTurn(d);
    if(checkPlayerDead()) return;
    if(b.enemy.hp <= 0){ victory(); return; }
  }

  endRound(d);
  if(b.over) return;
  render();
  save();
}
function fleeAction(){
  if(!canAct()) return;
  const d = getDerived();
  const b = S.battle;
  const c = Math.max(20, Math.min(90, 50 + (d.speed - enemySpeed(b)) + S.stats.luk*0.2));

  if(chance(c)){
    blog(`剣先で敵の視線を誘導し、一気に間合いを切った。離脱成功！`,'result');
    b.over = true;
    b.result = 'flee';
    save();
    render();
    return;
  }

  blog(`退路へ刃が回り込む。敵に間合いを支配され、離脱できない！`,'enemy');
  enemyTurn(d);
  if(checkPlayerDead()) return;
  if(b.enemy.hp <= 0){ victory(); return; }
  endRound(d);
  if(b.over) return;
  render();
  save();
}
function updateRating(oppRating, win){
  const diff = (oppRating || 1000) - S.rating;
  let expected;
  if(diff > 1000) expected = 0;
  else if(diff < -1000) expected = 1;
  else expected = 1 / (1 + Math.pow(10, diff/400));
  const delta = Math.round(32 * ((win ? 1 : 0) - expected));
  S.rating = Math.max(0, S.rating + delta);
}
function processLevelUps(){
  let ups = 0;
  while(S.exp >= expNeeded(S.level) && ups < 100000){
    S.exp -= expNeeded(S.level);
    S.level++;
    S.statPoints += 5;
    S.sp += 3;
    ups++;
    if(ups <= 5) blog(`レベルアップ！ Lv${fmt(S.level)}になった。ステータスポイント+5、SP+3。`);
  }
  if(ups > 5) blog(`さらに${fmt(ups - 5)}回のレベルアップ！`);
  if(ups >= 100000) blog('レベルアップ処理が多すぎたため一区切りつけた。');
}
function victory(){
  const b = S.battle;
  if(!b || b.over) return;

  b.over = true;
  b.result = 'win';
  blog(`決着――${b.enemy.name}の剣が地に落ちる。`,'result');
  blog(`${CLASSES[S.classId].name}として積み重ねた剣理が、また一段深まった。`,'stance');

  const d = getDerived();
  const expGain = Math.floor(b.enemy.exp * (1 + d.expBonus/100));
  const goldGain = Math.floor(b.enemy.gold * (1 + d.goldBonus/100));

  S.wins++;
  S.exp += expGain;
  S.gold += goldGain;
  blog(`経験値+${fmt(expGain)} / ゴールド+${fmt(goldGain)}`);

  const rankBefore=swordRankIndex();
  if(!b.isPvp && b.enemy.areaId && !b.enemy.fixedBoss){
    S.areaWins[b.enemy.areaId]=(S.areaWins[b.enemy.areaId]||0)+1;
  }
  if(b.enemy.fixedBoss && !S.clearedAreas.includes(b.enemy.areaId)){
    S.clearedAreas.push(b.enemy.areaId);
    const spec=AREA_BOSSES[b.enemy.areaId];
    S.sp+=spec.rewardSp;
    blog(`${spec.title}を制覇！ 初回報酬SP+${spec.rewardSp}。次の修練地が解放された。`,'result');
  }
  const rankAfter=swordRankIndex();
  if(rankAfter>rankBefore) blog(`段位昇格――「${SWORD_RANKS[rankAfter]}」に認められた！`,'result');

  const dropBase = b.isPvp ? 0.25 : Math.min(.98,(b.enemy.dropRate||.35) + S.stats.luk*0.002 + (b.enemy.boss ? 0.20 : 0));
  if(Math.random() < dropBase){
    if(S.inventory.length < 60){
      const item = generateItem(b.enemy.level, b.enemy.boss ? (chance(30) ? 'epic' : 'rare') : null, b.enemy.boss);
      S.inventory.push(item);
      blog(`ドロップ！ [${RARITIES[item.rarity].name}] ${item.name}`);
    }else{
      blog('インベントリがいっぱいでアイテムを持ち帰れなかった……');
    }
  }

  if(Math.random() < 0.08){
    S.sp += 1;
    blog('謎の老人が現れた。「良い剣筋だ」 SP+1！');
  }
  if(S.social.disciples.length && chance(25)){
    const disciple=choice(S.social.disciples);
    disciple.exp=(disciple.exp||0)+1;
    if(disciple.exp>=3){ disciple.exp=0; disciple.level++; S.social.bondPoints++; blog(`弟子の${disciple.name}が修練から学び、Lv${disciple.level}へ成長。師弟ポイント+1。`,'result'); }
  }

  if(b.isPvp){
    updateRating(b.enemy.rating, true);
    blog(`ランキングポイント増加！ 現在${fmt(S.rating)}pt`);
    MockServer.submitBattle({
      win:true,
      opponentId:b.opponentId,
      player:{name:S.name, classId:S.classId, level:S.level, rating:S.rating}
    }).catch(()=>{});
  }

  processLevelUps();
  save();
  render();
}
function defeat(){
  const b = S.battle;
  if(!b || b.over) return;

  b.over = true;
  b.result = 'lose';
  blog(`剣を握る手から力が抜ける。あなたは膝をついた……`,'enemySkill');
  blog(`敗北。しかし、受けた刃筋は次の修練の糧となる。`,'stance');

  S.losses++;
  const lossGold = Math.floor(S.gold * 0.1);
  if(lossGold > 0){
    S.gold -= lossGold;
    blog(`ゴールドを${fmt(lossGold)}失った。`);
  }

  if(b.isPvp){
    updateRating(b.enemy.rating, false);
    blog('ランキングポイント減少……');
    MockServer.submitBattle({
      win:false,
      opponentId:b.opponentId,
      player:{name:S.name, classId:S.classId, level:S.level, rating:S.rating}
    }).catch(()=>{});
  }

  save();
  render();
}

  takeDisciple(id){
    if(S.social.disciples.length>=10){ S.message='弟子は10人までです。'; render(); return; }
    if(S.social.disciples.some(x=>x.id===id)) return;
    const d=discipleCandidates().find(x=>x.id===id);
    if(!d) return;
    S.social.disciples.push(d); S.message=`${d.name}を弟子に迎えた。`;
    save(); render();
  },
  dismissDisciple(id){
    S.social.disciples=S.social.disciples.filter(x=>x.id!==id);
    S.message='弟子との契約を解除した。'; save(); render();
  },
  setSkillClass(cls){
    S.ui.skillClass = cls;
    const first = Object.values(SKILLS).find(s => s.cls === cls);
    S.ui.selectedSkill = first ? first.id : null;
    render();
  },
  selectSkill(id){
    S.ui.selectedSkill = id;
    render();
  },
  learnSkill(id){
    const sk = SKILLS[id];
    if(!canLearnSkill(sk)) return;
    S.sp -= sk.sp;
    S.learned.push(id);
    if(isUltimateSkill(sk) && !S.ui.ultimateLoadout) S.ui.ultimateLoadout=id;
    else if(sk.type==='active' && S.ui.activeLoadout.length<4) S.ui.activeLoadout.push(id);
    else if(sk.type==='passive' && S.ui.passiveLoadout.length<4) S.ui.passiveLoadout.push(id);
    S.message = `${sk.name}を習得した！`;
    save();
    render();
  },
  toggleLoadout(id){
    const sk=SKILLS[id];
    if(!sk||!hasSkill(id)) return;
    const allowed=sk.cls===S.classId || S.ui.inheritActive.includes(id) || S.ui.inheritPassive.includes(id);
    if(!allowed){ S.message='他職スキルは先に継承枠へ装備してください。'; render(); return; }
    if(isUltimateSkill(sk)){
      S.ui.ultimateLoadout=S.ui.ultimateLoadout===id?null:id;
    }else{
      const key=sk.type==='active'?'activeLoadout':'passiveLoadout',limit=4,list=S.ui[key],idx=list.indexOf(id);
      if(idx>=0) list.splice(idx,1);
      else if(list.length<limit) list.push(id);
      else { S.message=`${sk.type==='active'?'アクティブ':'パッシブ'}装備枠は4個まで。`; render(); return; }
    }
    save(); render();
  },
  toggleInheritSkill(id){
    const sk = SKILLS[id];
    if(!sk || !hasSkill(id) || sk.cls === S.classId || sk.name.startsWith('奥義・')) return;
    const key = sk.type === 'active' ? 'inheritActive' : 'inheritPassive';
    const list = S.ui[key];
    const idx = list.indexOf(id);
    if(idx >= 0){
      list.splice(idx, 1);
      S.ui.activeLoadout=S.ui.activeLoadout.filter(x=>x!==id);
      S.ui.passiveLoadout=S.ui.passiveLoadout.filter(x=>x!==id);
      S.message = `${sk.name}を継承枠から外した。`;
    }else if(list.length < 2){
      list.push(id);
      S.message = `${sk.name}を継承枠に装備した！`;
    }else{
      S.message = `${sk.type === 'active' ? 'アクティブ' : 'パッシブ'}継承枠は2個まで。`;
    }
    save();
    render();
  },
  changeClass(id){
    if(!canChangeClass(id)) return;
    if(ADVANCED_CLASSES.includes(id) && !S.classPath && !confirm(`${CLASSES[id].name}の系統を選びます。以後、別系統の上級職・最終職には進めません。よろしいですか？`)) return;
    if(ADVANCED_CLASSES.includes(id) && !S.classPath) S.classPath = id;
    S.classId = id;
    S.ui.inheritActive = S.ui.inheritActive.filter(skillId => SKILLS[skillId] && SKILLS[skillId].cls !== id).slice(0,2);
    S.ui.inheritPassive = S.ui.inheritPassive.filter(skillId => SKILLS[skillId] && SKILLS[skillId].cls !== id).slice(0,2);
    S.ui.skillClass = id;
    S.ui.selectedSkill = null;
    S.ui.activeLoadout=S.learned.filter(skillId=>SKILLS[skillId]&&SKILLS[skillId].cls===id&&SKILLS[skillId].type==='active'&&!isUltimateSkill(SKILLS[skillId])).slice(0,4);
    S.ui.passiveLoadout=S.learned.filter(skillId=>SKILLS[skillId]&&SKILLS[skillId].cls===id&&SKILLS[skillId].type==='passive').slice(0,4);
    S.ui.ultimateLoadout=S.learned.find(skillId=>SKILLS[skillId]&&SKILLS[skillId].cls===id&&isUltimateSkill(SKILLS[skillId]))||null;
    S.message = `${CLASSES[id].name}に転職した！`;
    save();
    render();
  },
  equipItem(id){
    const idx = S.inventory.findIndex(i => i.id === id);
    if(idx < 0) return;
    const item = S.inventory[idx];
    const slot = item.slot;
    const old = S.equip[slot];

    S.inventory.splice(idx, 1);
    S.equip[slot] = item;
    if(old) S.inventory.push(old);

    S.message = `${item.name}を装備した！`;
    save();
    render();
  },
  unequipItem(slot){
    const item = S.equip[slot];
    if(!item) return;
    if(S.inventory.length >= 60){
      S.message = 'インベントリがいっぱいで外せない。';
    }else{
      S.inventory.push(item);
      S.equip[slot] = null;
      S.message = `${item.name}を外した。`;
    }
    save();
    render();
  },
  sellItem(id){
    const idx = S.inventory.findIndex(i => i.id === id);
    if(idx < 0) return;
    const item = S.inventory[idx];
    S.gold += item.sell;
    S.inventory.splice(idx, 1);
    S.message = `${item.name}を${fmt(item.sell)}Gで売った。`;
    save();
    render();
  },
  enhanceItem(slot){
    const item=S.equip[slot];
    if(!item || (item.enhance||0)>=20) return;
    const cost=enhanceCost(item);
    if(S.gold<cost){ S.message=`強化に${fmt(cost)}G必要です。`; render(); return; }
    S.gold-=cost; item.enhance=(item.enhance||0)+1;
    S.message=`${item.name}を+${item.enhance}へ強化した！ 全能力+${item.enhance*12}%相当。`;
    save(); render();
  },
  startBattle(areaId){
    if(!areaUnlocked(areaId)) return;
    const enemy = makeEnemy(areaId);
    initBattle(enemy, false, null);
    S.screen = 'battle';
    render();
  },
  startBoss(areaId){
    if(!bossUnlocked(areaId) || S.clearedAreas.includes(areaId)) return;
    initBattle(makeAreaBoss(areaId),false,null);
    S.screen='battle';
    render();
  },
  startPvp(id){
    if(!S.rankingData) return;
    const op = S.rankingData.pvp.find(e => e.id === id);
    if(!op || op.isPlayer) return;
    const enemy = makePvpEnemy(op);
    initBattle(enemy, true, op.id);
    S.screen = 'battle';
    render();
  },
  setRankingMode(mode){ S.ui.rankingMode=mode; save(); render(); },
  attack(){
    if(!canAct()) return;
    performAction({type:'attack'});
  },
  useSkill(id){
    if(!canAct()) return;
    performAction({type:'skill', id});
  },
  defend(){
    if(!canAct()) return;
    performAction({type:'defend'});
  },
  flee(){
    if(!canAct()) return;
    fleeAction();
  },
  closeBattle(){
    S.battle = null;
    S.screen = 'adventure';
    save();
    render();
  },
  openRanking(){
    S.screen = 'ranking';
    S.rankingLoading = true;
    render();

    MockServer.fetchRanking({
      name:S.name,
      classId:S.classId,
      level:S.level,
      rating:S.rating,
      power:getCombatPower()
    }).then(res => {
      if(S.screen !== 'ranking') return;
      S.rankingData = res;
      S.rankingLoading = false;
      render();
    }).catch(() => {
      if(S.screen !== 'ranking') return;
      S.rankingLoading = false;
      S.message = 'ランキング取得に失敗した。';
      render();
    });
  },
  resetGame(){
    if(confirm('セーブデータを削除して初期化しますか？')){
      localStorage.removeItem(SAVE_KEY);
      localStorage.removeItem(SERVER_KEY);
      S = defaultState();
      render();
    }
  }
};

function nodePos(sk){
  return {left:30 + sk.col*260, top:25 + (sk.tier - 1)*120};
}
function nodeCenter(sk){
  const p = nodePos(sk);
  return {x:p.left + 85, y:p.top + 29};
}
function skillTreeHtml(cls, selectedId){
  const skills = Object.values(SKILLS).filter(s => s.cls === cls);
  let lines = '';

  for(const sk of skills){
    for(const reqId of sk.req){
      const req = SKILLS[reqId];
      if(!req) continue;
      const a = nodeCenter(req);
      const b = nodeCenter(sk);
      lines += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="svgline ${hasSkill(reqId) ? 'learned' : ''}"/>`;
    }
  }

  const nodes = skills.map(sk => {
    const pos = nodePos(sk);
    const learned = hasSkill(sk.id);
    const available = canLearnSkill(sk);
    let clsName = 'node';
    if(learned) clsName += ' learned';
    else if(available) clsName += ' available';
    else clsName += ' locked';
    if(sk.id === selectedId) clsName += ' selected';

    return `
    <div class="${clsName}" style="left:${pos.left}px;top:${pos.top}px" onclick="G.selectSkill('${sk.id}')">
      <b>${sk.name}</b><br>
      <span class="small">${sk.type === 'active' ? 'アクティブ' : 'パッシブ'} / SP${sk.sp}</span>
    </div>`;
  }).join('');

  return `
  <div class="treeWrap">
    <div class="tree">
      <svg width="620" height="540">${lines}</svg>
      ${nodes}
    </div>
  </div>`;
}

          ${S.classId !== selected.cls ? '<span class="pill warn">この職業中は習得不可</span>' : ''}
        </div>
      </div>
    ` : ''}
  </div>`;

    <h3>インベントリ</h3>
    ${S.inventory.length === 0 ? '<div class="small">アイテムを持っていない。戦闘でドロップを狙おう。</div>' : `
      <div class="grid wide">
        ${S.inventory.map(item => `
          <div class="card">
            <div class="itemName ${RARITIES[item.rarity].cls}">${item.name} +${item.enhance||0}</div>
            <div class="small">${RARITIES[item.rarity].name} / Lv${fmt(item.level)} / ${item.slot === 'weapon' ? '武器' : item.slot === 'armor' ? '防具' : '装飾'}</div>
            <div class="small">${itemStatsText(item)}</div>
            <div class="flex" style="margin-top:6px">
              <button onclick="G.equipItem('${item.id}')">装備</button>
              <button onclick="G.sellItem('${item.id}')">売却 ${fmt(item.sell)}G</button>
            </div>
          </div>
        `).join('')}
      </div>
    `}
  </div>`;
}
function classView(){
  return `
  <div class="panel">
    <h2>職業</h2>
    <p class="small">Lv35で各系統の最終職へ。剣聖は剣士を貫いた者だけの最終職です。習得済みスキルは消えませんが、他職スキルは継承枠に装備したものだけ有効です。</p>
    <div class="grid wide">
      ${CLASS_ORDER.map(id => {
        const c = CLASSES[id];
        const current = S.classId === id;
        const can = canChangeClass(id);
        const req = isFinalClass(id)
          ? `Lv${fmt(c.reqLevel)}以上、${CLASSES[FINAL_CLASS_FROM[id]].name}から`
          : `Lv${fmt(c.reqLevel)}以上`;

        return `
        <div class="card ${current ? 'learned' : ''}">
          <div class="flex">
            <b>${c.name}</b>
            <span class="pill right">${current ? '現在' : req}</span>
          </div>
          <div class="small">${c.desc}</div>
          <div class="small good">${c.mechanic}</div>
          <div class="small">補正：HP x${c.hp} / 攻 x${c.atk} / 防 x${c.def} / 速 x${c.spd} / スキル x${c.skill}</div>
          <button onclick="G.changeClass('${id}')" ${current || !can ? 'disabled' : ''}>${current ? '現在の職業' : can ? '転職する' : '条件未達'}</button>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}
function socialView(){
  const mentor=S.social.mentor;
  const candidates=discipleCandidates().filter(x=>!S.social.disciples.some(d=>d.id===x.id));
  return `
  <div class="panel">
    <h2>師弟</h2>
    <div class="card"><b>隠しステータス「剣縁」</b><span class="pill right">全戦闘能力+${bondBonusPct().toFixed(2)}%</span>
      <div class="small">師匠から最大2.5%、弟子の成長から最大2.5%。合計上限5%。将来のオンラインではサーバー側で計算します。</div>
    </div>
    <h3>師匠（1人）</h3>
    ${mentor?`<div class="card learned"><b>${mentor.name}</b>　${CLASSES[mentor.classId].name} Lv${fmt(mentor.level)}<div class="small">戦闘力 ${fmt(mentor.power)}／変更可能：${new Date(S.social.changeAvailableAt).toLocaleDateString('ja-JP')}</div><button onclick="G.releaseMentor()" ${Date.now()>=S.social.changeAvailableAt?'':'disabled'}>師匠を変更する</button></div>`:
    `<div class="grid wide">${mentorCandidates().map(m=>`<div class="card"><b>${m.name}</b><div class="small">${CLASSES[m.classId].name} Lv${fmt(m.level)}／戦闘力${fmt(m.power)}</div><button onclick="G.chooseMentor('${m.id}')">師事する</button></div>`).join('')}</div>`}
    <h3>弟子（${S.social.disciples.length}/10）</h3>
    ${S.social.disciples.length?`<div class="grid wide">${S.social.disciples.map(d=>`<div class="card"><b>${d.name}</b><div class="small">${CLASSES[d.classId].name} Lv${fmt(d.level)}／修練${d.exp||0}/3</div><button onclick="G.dismissDisciple('${d.id}')">契約解除</button></div>`).join('')}</div>`:'<p class="small">まだ弟子はいません。</p>'}
    ${S.social.disciples.length<10?`<h3>弟子候補</h3><div class="grid wide">${candidates.slice(0,10).map(d=>`<div class="card"><b>${d.name}</b><div class="small">${CLASSES[d.classId].name} Lv${fmt(d.level)}</div><button onclick="G.takeDisciple('${d.id}')">弟子に取る</button></div>`).join('')}</div>`:''}
    <div class="footerNote">現在は一人用のNPC師弟。データにはuserId・masterIdを保持し、オンライン移行時に実ユーザーへ置換できます。</div>
  </div>`;
}
function rankingView(){
  if(S.rankingLoading){
    return `
    <div class="panel">
      <h2>PVPランキング</h2>
      <div class="loading">モックサーバーからランキングを取得中……</div>
    </div>`;
  }

  if(!S.rankingData){
    return `
    <div class="panel">
      <h2>PVPランキング</h2>
      <div class="small">データなし。</div>
      <button onclick="G.openRanking()">再読み込み</button>
    </div>`;
  }

  const mode=S.ui.rankingMode||'pvp';
  const list=mode==='power'?S.rankingData.power:S.rankingData.pvp;

  return `
  <div class="panel">
    <h2>非同期PVP・ランキング</h2>
    <p class="small">攻撃側は手動操作、防衛側は保存スナップショットをAI操作。現在はローカル疑似サーバーです。</p>
    <div class="flex"><button class="${mode==='pvp'?'primary':''}" onclick="G.setRankingMode('pvp')">シーズンPVP：${SEASON_ID}</button><button class="${mode==='power'?'primary':''}" onclick="G.setRankingMode('power')">無期限・総合戦闘力</button></div>
    <div class="tableWrap">
      <table>
        <thead>
          <tr><th>位</th><th>名前</th><th>職業／二つ名</th><th>Lv</th><th>${mode==='power'?'戦闘力':'Rate'}</th><th>行動</th></tr>
        </thead>
        <tbody>
          ${list.map((e, i) => `
            <tr style="${e.isPlayer ? 'background:#24304a;' : ''}">
              <td>${i+1}</td>
              <td>${esc(e.name)}${e.isPlayer ? '（あなた）' : ''}</td>
              <td>${esc(e.title)}</td>
              <td>${fmt(e.level)}</td>
              <td>${fmt(mode==='power'?e.power:e.rating)}</td>
              <td>${e.isPlayer||mode==='power' ? '-' : `<button onclick="G.startPvp('${e.id}')">防衛AIへ挑戦</button>`}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    <div class="flex" style="margin-top:10px">
      <button onclick="G.openRanking()">更新</button>
    </div>
  </div>`;
}
function storyView(){
  const step = Math.min(S.storyStep, STORY.length - 1);
  return `
  <div class="panel">
    <h2>物語</h2>
    <div class="storyText">${STORY[step]}</div>
    <div class="flex">
      ${step < STORY.length - 1
        ? `<button class="primary" onclick="G.nextStory()">次へ</button>`
        : `<button class="primary" onclick="G.nav('adventure')">冒険へ</button>`}
      <button onclick="G.restartStory()">最初から読む</button>
    </div>
  </div>`;
}
function settingsView(){
  return `
  <div class="panel">
    <h2>設定・解説</h2>

    <div class="card">
      <b>チュートリアル</b>
      ${TUTORIAL.map(t => `<div class="small"><b>${t.h}</b>：${t.p}</div>`).join('')}
    </div>

    <div class="card">
      <b>PVPサーバー設計メモ</b>
      ${SERVER_DESIGN.map(x => `<div class="small">${x}</div>`).join('')}
    </div>

    <div class="flex">
      <button onclick="G.restartStory()">ストーリーを最初から</button>
      <button class="danger" onclick="G.resetGame()">セーブ初期化</button>
    </div>
  </div>`;
}
function battleView(){
  const b = S.battle;
  if(!b) return adventureView();

  const d = getDerived();
  const hpPct = Math.max(0, Math.floor((b.playerHP / b.maxHP) * 100));
  const kiPct = Math.max(0, Math.floor((b.playerKI / b.maxKI) * 100));
  const ehpPct = Math.max(0, Math.floor((b.enemy.hp / b.enemy.maxHP) * 100));

  const activeSkills = usableSkillIds('active')
    .map(id => SKILLS[id])
    .filter(sk => sk && sk.type === 'active')
    .sort((a,b) => (a.tier - b.tier) || ((a.ki || 0) - (b.ki || 0)));

  const stackPills = Object.entries(b.stacks)
    .filter(([k,v]) => v > 0)
    .map(([k,v]) => `<span class="pill warn">${RESOURCE_NAMES[k]} ${v}/${STACK_MAX[k]}</span>`)
    .join('');

  const enemyStatusPills = [
    b.enemyStatuses.burn.turns > 0 ? `<span class="pill bad">炎上${b.enemyStatuses.burn.turns}</span>` : '',
    b.enemyStatuses.bleed.turns > 0 ? `<span class="pill bad">出血${b.enemyStatuses.bleed.turns}</span>` : '',
    b.enemyStatuses.curse.turns > 0 ? `<span class="pill bad">呪い${b.enemyStatuses.curse.turns}</span>` : '',
    b.enemyStatuses.stun > 0 ? `<span class="pill bad">怯み</span>` : '',
    b.enemyStatuses.freeze > 0 ? `<span class="pill bad">凍結${b.enemyStatuses.freeze}</span>` : ''
  ].join('');

  let actions = '';
  if(b.over){
    actions = `<button class="primary" onclick="G.closeBattle()">道場へ戻る</button>`;
  }else{
    actions = `
      <button onclick="G.attack()">通常攻撃</button>
      <button onclick="G.defend()">防御</button>
      <button onclick="G.flee()">逃げる</button>
      <div class="skillButtons">
        ${activeSkills.map(sk => `
          <button onclick="G.useSkill('${sk.id}')" ${skillUsable(sk) ? '' : 'disabled'} title="${esc(sk.desc + ' ' + skillFlavor(sk))}">
            ${sk.name}<br>
            <span class="small">
              ${sk.ki ? `KI${skillKiCost(sk)}` : ''}
              ${sk.hpCost ? `HP${sk.hpCost}%` : ''}
              ${sk.fx && sk.fx.stackConsume && sk.fx.stackConsume.required ? ` / ${RESOURCE_NAMES[sk.fx.stackConsume.type]}必須` : ''}
            </span><br><span class="small">熟練Lv${skillMastery(sk.id).level}・使用${fmt(skillMastery(sk.id).uses)}回</span><br><span class="small">${skillFlavor(sk).slice(0,34)}…</span>
          </button>
        `).join('')}
      </div>
    `;
  }

  return `
  <div class="panel">
    <h2>${b.isPvp ? 'ランキング戦' : '戦闘'}</h2>

    <div class="battleRow">
      <div class="card">
        <b>${esc(S.name)}</b> Lv${fmt(S.level)}
        <div class="bar hp"><div style="width:${hpPct}%"></div></div>
        <div class="small">HP ${fmt(Math.max(0, b.playerHP))} / ${fmt(b.maxHP)}</div>
        <div class="bar ki"><div style="width:${kiPct}%"></div></div>
        <div class="small">気力 ${fmt(Math.max(0, b.playerKI))} / ${fmt(b.maxKI)}</div>
        <div>${stackPills}</div>
        ${b.shield > 0 ? `<span class="pill good">シールド ${fmt(b.shield)}</span>` : ''}
        ${b.statuses.dodgeNext ? '<span class="pill good">必中回避</span>' : ''}
        ${b.statuses.burn.turns > 0 ? `<span class="pill bad">炎上${b.statuses.burn.turns}</span>` : ''}
        ${b.statuses.curse.turns > 0 ? `<span class="pill bad">呪い${b.statuses.curse.turns}</span>` : ''}
        ${b.statuses.freeze > 0 ? `<span class="pill bad">凍結${b.statuses.freeze}</span>` : ''}
        ${b.playerDefending ? '<span class="pill">防御中</span>' : ''}
      </div>

      <div class="vs">VS</div>

      <div class="card">
        <b>${esc(b.enemy.name)}</b> Lv${fmt(b.enemy.level)}
        <div class="bar enemy"><div style="width:${ehpPct}%"></div></div>
        <div class="small">HP ${fmt(Math.max(0, b.enemy.hp))} / ${fmt(b.enemy.maxHP)}</div>
        ${b.isPvp ? `<div class="small">Rating ${fmt(b.enemy.rating)}</div>` : ''}
        <div class="skillFlavor"><b>敵の予兆</b><br>${enemyIntentText(b)}</div>
        ${Array.isArray(b.enemy.skills) ? `<div class="small">警戒技：${b.enemy.skills.map(s => s.name.replace(/^敵技・|^主技・/, '')).join('／')}</div>` : ''}
        <div>${enemyStatusPills}</div>
        ${b.enemy.boss ? '<span class="pill warn">BOSS</span>' : ''}
      </div>
    </div>

    <div class="log">
      ${b.log.map(l => {
        const entry = typeof l === 'string' ? {text:l,type:'system'} : l;
        return `<div><span class="log-${esc(entry.type || 'system')}">${esc(entry.text)}</span></div>`;
      }).join('')}
    </div>

    <div class="actions">${actions}</div>
  </div>`;
}
function contentView(){
  switch(S.screen){
    case 'adventure': return adventureView();
    case 'status': return statusView();
    case 'skills': return skillsView();
    case 'equip': return equipView();
    case 'class': return classView();
    case 'social': return socialView();
    case 'ranking': return rankingView();
    case 'story': return storyView();
    case 'settings': return settingsView();
    default: return adventureView();
  }
}
function render(){
  const app = document.getElementById('app');

  if(S.screen === 'title'){
    app.innerHTML = titleView();
  }else if(S.screen === 'create'){
    app.innerHTML = createView();
  }else if(S.screen === 'intro'){
    app.innerHTML = introView();
  }else if(S.screen === 'battle'){
    app.innerHTML = battleView();
  }else{
    app.innerHTML = headerView() + navView() + contentView();
  }

  const log = document.querySelector('.log');
  if(log) log.scrollTop = log.scrollHeight;
}
function init(){
  load();
  window.G = G;
  render();
}
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
